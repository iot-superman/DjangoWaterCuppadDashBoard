[mqtt]
# ============================================================
# Windows 本機 MQTT 測試設定
#
# 預設使用公開測試 Broker，資料沒有隱私性，僅供課堂測試。
# 若你已有自己的 Broker，請直接修改以下五個設定。
# ============================================================
broker = broker.emqx.io
port = 1883
topic = smartwatercup/311/drink
username =
password =
use_tls = false

[device]
# 裝置未在 JSON 內提供 uid 時，使用此預設值。
default_uid = 311

