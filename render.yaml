# V5：Render 免費 Django + SQLite 示範部署（不建立 PostgreSQL）。
# 警告：Render Free 休眠／重啟／重新部署時，SQLite 的新增資料會遺失。
services:
  - type: web
    name: django-water-cuppad-dashboard
    runtime: python
    plan: free
    region: singapore
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --noinput && python manage.py ensure_admin && python -m gunicorn water_dashboard_sqlite.wsgi:application"
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MQTT_API_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@example.com"
